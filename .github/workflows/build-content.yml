name: Build Content Pages

on:
  push:
    paths:
      - "content/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build HTML from markdown
        run: node scripts/build.js

      - name: Commit updated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html milestones.html dev-notes.html english.html
          git diff --staged --quiet || git commit -m "🤖 Auto-build: update content pages [skip ci]"
          git push