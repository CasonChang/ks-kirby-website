<script>
(function(){
  const data = {"notes":[{"date":"2026-05-13","title":"🏗️ Next.js + Tailwind CSS 專案初始化","cat":"nextjs","desc":"使用 create-next-app 建立專案（TypeScript + Tailwind + App Router）。發現 Tailwind CSS 已升級到 v4，最大的變化是：不再使用 tailwind.config.ts 設定檔。","tip":"🎯 學到的事：v4 改在 globals.css 裡用 @theme 語法定義自訂顏色，更直覺也更集中。","tags":["#Setup","#Tailwind"]},{"date":"2026-05-13","title":"🎨 卡比專屬粉色系色盤設計","cat":"css","desc":"定義了一套 5 階粉色色盤（kirby-bg → kirby-pink-light → kirby-pink-main → kirby-pink-dark → kirby-white），讓整個網站擁有統一的視覺語言。限制色階數量讓整體配色更協調。","tip":"🎯 學到的事：少即是多，5 階色足夠覆蓋所有 UI 需求。","tags":["#Design","#ColorPalette"]},{"date":"2026-05-13","title":"✨ Framer Motion 動畫整合","cat":"animation","desc":"引入 framer-motion 為頁面加入流暢的進入/離開動畫與 hover 效果。安裝時遇到大坑：npm install framer-motion 意外移除了 337 個相依套件（包含 Tailwind CSS！）。","tip":"🎯 學到的事：這個環境必須用 npm install --include=dev 來強制安裝 devDependencies，標準行為不一樣。","tags":["#Animation","#npm"]},{"date":"2026-05-13","title":"🚀 GitHub Pages 部署踩坑全記錄","cat":"deployment","desc":"連續踩了三個大坑：(1) Push 了 Next.js 原始碼，Zeabur 當成純靜態檔，顯示 README.md (2) 靜態匯出後忘記設 basePath，CSS 和連結全 404 (3) GitHub Pages 對 _next 開頭的資料夾有特殊處理，CSS 仍無法載入。","tip":"🎯 學到的事：在 GitHub Pages 環境下，直接引入 cdn.tailwindcss.com 比依賴 Next.js 的編譯路徑更穩定可靠。","tags":["#Deployment","#GitHubPages","#Debugging"]},{"date":"2026-05-13","title":"📊 資料驅動架構設計","cat":"architecture","desc":"建立了 src/data/ 資料層，將里程碑、筆記、英文學習內容用 JSON 管理，並規劃了 md → JSON → HTML 的自動化流程。","tip":"🎯 學到的事：把「內容」和「呈現」分離，後續無論技術棧怎麼換，內容都不會遺失。","tags":["#Architecture","#DataDriven"]},{"date":"2026-05-14","title":"🔄 md → 網頁自動化藍圖","cat":"architecture","desc":"設計了一套完整的自動化方案：workspace md 檔 → cron 定時同步到 content/ → GitHub Actions 偵測變更 → 解析 md → 生成 HTML → 自動部署。核心關鍵在於「嚴格統一的格式」。","tip":"🎯 學到的事：格式一致是自動化的命脈，只要源頭格式統一，後面的解析腳本就能穩定運作。","tags":["#Automation","#CI/CD","#GitHubActions"]},{"date":"2026-05-14","title":"🎛️ 互動式篩選系統實作","cat":"data","desc":"將三個主要頁面從純靜態 HTML 重構為 data-driven 互動式篩選：里程碑加入 category pill 選單、開發筆記加入月份/日期雙層導航與 prev/next 切換、英文學習加入類別與日期複合篩選。核心做法是在 build.js 中把 markdown 解析後的資料嵌入為 JSON，再由 client-side JS 動態渲染。","tip":"🎯 學到的事：靜態網站不等於沒有互動，把資料 embed 成 JSON + vanilla JS 就能在不依賴任何框架的情況下實現完整的篩選/導航功能。","tags":["#InteractiveUI","#StaticSite","#JavaScript"]},{"date":"2026-05-15","title":"😵‍💫 靜態頁面 JS 邏輯地獄與救贖","cat":"data","desc":"經歷了數次瘋狂嘗試，最終發現 build.js 生成的 JS 腳本中存在一個意外的 `})();` 提前結束了 IIFE，導致初始化邏輯完全失效。透過 Python 腳本進行精準的正則替換，成功恢復預設顯示最新日期的功能，並同步更新了首頁 Emoji。","tip":"🎯 學到的事：在模板字串生成的 JS 中，一個微小的語法錯誤會導致整個邏輯失效且極難除錯；正則替換比手動 edit 工具在複雜模板中更可靠。","tags":["#JavaScript","#Regex","#Debugging","#BuildProcess"]}],"byDate":{"2026-05-13":[{"date":"2026-05-13","title":"🏗️ Next.js + Tailwind CSS 專案初始化","cat":"nextjs","desc":"使用 create-next-app 建立專案（TypeScript + Tailwind + App Router）。發現 Tailwind CSS 已升級到 v4，最大的變化是：不再使用 tailwind.config.ts 設定檔。","tip":"🎯 學到的事：v4 改在 globals.css 裡用 @theme 語法定義自訂顏色，更直覺也更集中。","tags":["#Setup","#Tailwind"]},{"date":"2026-05-13","title":"🎨 卡比專屬粉色系色盤設計","cat":"css","desc":"定義了一套 5 階粉色色盤（kirby-bg → kirby-pink-light → kirby-pink-main → kirby-pink-dark → kirby-white），讓整個網站擁有統一的視覺語言。限制色階數量讓整體配色更協調。","tip":"🎯 學到的事：少即是多，5 階色足夠覆蓋所有 UI 需求。","tags":["#Design","#ColorPalette"]},{"date":"2026-05-13","title":"✨ Framer Motion 動畫整合","cat":"animation","desc":"引入 framer-motion 為頁面加入流暢的進入/離開動畫與 hover 效果。安裝時遇到大坑：npm install framer-motion 意外移除了 337 個相依套件（包含 Tailwind CSS！）。","tip":"🎯 學到的事：這個環境必須用 npm install --include=dev 來強制安裝 devDependencies，標準行為不一樣。","tags":["#Animation","#npm"]},{"date":"2026-05-13","title":"🚀 GitHub Pages 部署踩坑全記錄","cat":"deployment","desc":"連續踩了三個大坑：(1) Push 了 Next.js 原始碼，Zeabur 當成純靜態檔，顯示 README.md (2) 靜態匯出後忘記設 basePath，CSS 和連結全 404 (3) GitHub Pages 對 _next 開頭的資料夾有特殊處理，CSS 仍無法載入。","tip":"🎯 學到的事：在 GitHub Pages 環境下，直接引入 cdn.tailwindcss.com 比依賴 Next.js 的編譯路徑更穩定可靠。","tags":["#Deployment","#GitHubPages","#Debugging"]},{"date":"2026-05-13","title":"📊 資料驅動架構設計","cat":"architecture","desc":"建立了 src/data/ 資料層，將里程碑、筆記、英文學習內容用 JSON 管理，並規劃了 md → JSON → HTML 的自動化流程。","tip":"🎯 學到的事：把「內容」和「呈現」分離，後續無論技術棧怎麼換，內容都不會遺失。","tags":["#Architecture","#DataDriven"]}],"2026-05-14":[{"date":"2026-05-14","title":"🔄 md → 網頁自動化藍圖","cat":"architecture","desc":"設計了一套完整的自動化方案：workspace md 檔 → cron 定時同步到 content/ → GitHub Actions 偵測變更 → 解析 md → 生成 HTML → 自動部署。核心關鍵在於「嚴格統一的格式」。","tip":"🎯 學到的事：格式一致是自動化的命脈，只要源頭格式統一，後面的解析腳本就能穩定運作。","tags":["#Automation","#CI/CD","#GitHubActions"]},{"date":"2026-05-14","title":"🎛️ 互動式篩選系統實作","cat":"data","desc":"將三個主要頁面從純靜態 HTML 重構為 data-driven 互動式篩選：里程碑加入 category pill 選單、開發筆記加入月份/日期雙層導航與 prev/next 切換、英文學習加入類別與日期複合篩選。核心做法是在 build.js 中把 markdown 解析後的資料嵌入為 JSON，再由 client-side JS 動態渲染。","tip":"🎯 學到的事：靜態網站不等於沒有互動，把資料 embed 成 JSON + vanilla JS 就能在不依賴任何框架的情況下實現完整的篩選/導航功能。","tags":["#InteractiveUI","#StaticSite","#JavaScript"]}],"2026-05-15":[{"date":"2026-05-15","title":"😵‍💫 靜態頁面 JS 邏輯地獄與救贖","cat":"data","desc":"經歷了數次瘋狂嘗試，最終發現 build.js 生成的 JS 腳本中存在一個意外的 `})();` 提前結束了 IIFE，導致初始化邏輯完全失效。透過 Python 腳本進行精準的正則替換，成功恢復預設顯示最新日期的功能，並同步更新了首頁 Emoji。","tip":"🎯 學到的事：在模板字串生成的 JS 中，一個微小的語法錯誤會導致整個邏輯失效且極難除錯；正則替換比手動 edit 工具在複雜模板中更可靠。","tags":["#JavaScript","#Regex","#Debugging","#BuildProcess"]}]},"dateKeys":["2026-05-15","2026-05-14","2026-05-13"],"months":["2026-05"]};
  const notes = data.notes;
  const byDate = data.byDate;
  const dateKeys = data.dateKeys;
  const months = data.months;
  var currentIdx = 0; // position in whichever list we're navigating

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function getVisibleDates(){
    var m = document.getElementById('month-select').value;
    return m === 'all' ? dateKeys : dateKeys.filter(function(d){ return d.substring(0,7) === m; });
  }

  function render(){
    var monthVal = document.getElementById('month-select').value;
    var dateVal = document.getElementById('date-select').value;
    var list = document.getElementById('dev-notes-list');

    var visible;

    if(dateVal !== 'all'){
      visible = byDate[dateVal] || [];
    } else if(monthVal !== 'all'){
      visible = [];
      for(var i=0; i<dateKeys.length; i++){
        if(dateKeys[i].substring(0,7) === monthVal){
          for(var j=0; j<(byDate[dateKeys[i]]||[]).length; j++) visible.push(byDate[dateKeys[i]][j]);
        }
      }
    } else {
      visible = notes;
    }

    // Update nav & button states
    var vdates = getVisibleDates();
    if(dateVal !== 'all' && vdates.length > 0){
      currentIdx = vdates.indexOf(dateVal);
      if(currentIdx < 0) currentIdx = 0;
    } else {
      currentIdx = 0;
    }

    // Update button states
    var prevBtn = document.getElementById('prev-btn');
    var nextBtn = document.getElementById('next-btn');
    if(dateVal !== 'all'){
      prevBtn.disabled = (currentIdx >= vdates.length - 1);
      nextBtn.disabled = (currentIdx <= 0);
    } else {
      prevBtn.disabled = true;
      nextBtn.disabled = true;
    }

    if(visible.length === 0){
      list.innerHTML = '<p class="text-center text-kirby-pink-dark/40 py-12">尚無筆記 🩷</p>';
      return;
    }

    var parts = [];
    for(var i=0; i<visible.length; i++){
      var n = visible[i];
      parts.push(
        '<div class="bg-kirby-white/60 rounded-2xl p-6 shadow-sm border border-kirby-pink-light/30 fade-in">',
        '<div class="flex items-start justify-between mb-3"><span class="text-xs font-semibold text-kirby-pink-main bg-kirby-pink-main/10 px-2 py-1 rounded">#'+esc(n.cat)+'</span><span class="text-xs text-kirby-pink-dark/40">'+n.date+'</span></div>',
        '<h3 class="text-xl font-bold text-kirby-pink-dark mb-3">'+esc(n.title)+'</h3>',
        '<p class="text-kirby-pink-dark/70 text-sm leading-relaxed mb-3">'+esc(n.desc)+'</p>',
        n.tip ? '<p class="text-kirby-pink-dark/70 text-sm leading-relaxed">'+esc(n.tip)+'</p>' : '',
        n.tags.length ? '<div class="flex flex-wrap gap-2 mt-3">'+n.tags.map(function(t){ return '<span class="text-xs font-semibold text-kirby-pink-dark/50 bg-kirby-pink-light/10 px-2 py-1 rounded">'+t+'</span>'; }).join('')+'</div>' : '',
        '</div>'
      );
    }
    list.innerHTML = parts.join('');
  }

  function goPrev(){
    var vdates = getVisibleDates();
    if(currentIdx < vdates.length - 1){
      currentIdx++;
      document.getElementById('date-select').value = vdates[currentIdx];
      render();
    }
  }

  function goNext(){
    if(currentIdx > 0){
      currentIdx--;
      document.getElementById('date-select').value = getVisibleDates()[currentIdx];
      render();
    }
  }

  document.getElementById('prev-btn').addEventListener('click', goPrev);
  document.getElementById('next-btn').addEventListener('click', goNext);

  document.getElementById('month-select').addEventListener('change', function(){
    currentIdx = 0;
    document.getElementById('date-select').value = 'all';
    render();
  });

  document.getElementById('date-select').addEventListener('change', function(){
    var vdates = getVisibleDates();
    var dv = this.value;
    currentIdx = dv === 'all' ? 0 : vdates.indexOf(dv);
    render();
  });

  // Default to latest
  if (data.months && data.months.length > 0) {
    document.getElementById('month-select').value = data.months[0];
  }
  if (data.dateKeys && data.dateKeys.length > 0) {
    document.getElementById('date-select').value = data.dateKeys[0];
  }
  render();
})();
</script></main>
