<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>英文複習卡 - 森之卡比</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>tailwind.config={theme:{extend:{colors:{'kirby-bg':'#FFF0F3','kirby-pink-light':'#FFB7C5','kirby-pink-main':'#FF8FAB','kirby-pink-dark':'#E06C84','kirby-white':'#FFFFFF'}}}}</script><style>
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .5s ease-out forwards;opacity:0}
.fade-1{animation-delay:.1s}.fade-2{animation-delay:.2s}.fade-3{animation-delay:.3s}.fade-4{animation-delay:.4s}.fade-5{animation-delay:.5s}.fade-6{animation-delay:.6s}.fade-7{animation-delay:.7s}.fade-8{animation-delay:.8s}.fade-9{animation-delay:.9s}
.badge{display:inline-block;padding:4px 16px;border-radius:9999px;font-size:.75rem;font-weight:700;margin-bottom:1rem}
.incorrect{text-decoration:line-through;color:#E06C84}.correct{color:#2d8a56;font-weight:600}
.cat-btn{transition:all .2s}.cat-btn.active{background-color:#FF8FAB!important;color:#fff!important}
select:focus{outline:none;border-color:#FF8FAB!important;box-shadow:0 0 0 2px rgba(255,143,171,.3)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}.nav-btn:not(:disabled):hover{opacity:1;background-color:#FFB7C5}
</style></head>
<body class="bg-kirby-bg text-kirby-pink-dark font-sans min-h-screen flex flex-col">
<nav class="w-full max-w-4xl mx-auto px-6 py-4 flex justify-start md:justify-center gap-3 overflow-x-auto no-scrollbar whitespace-nowrap"><a class="px-4 py-2 rounded-full text-sm md:text-base font-medium transition-all shrink-0 bg-kirby-white/60 text-kirby-pink-dark hover:bg-kirby-pink-light/40" href="/ks-kirby-website/">🏠 首頁</a><a class="px-4 py-2 rounded-full text-sm md:text-base font-medium transition-all shrink-0 bg-kirby-white/60 text-kirby-pink-dark hover:bg-kirby-pink-light/40" href="/ks-kirby-website/milestones">🏆 里程碑</a><a class="px-4 py-2 rounded-full text-sm md:text-base font-medium transition-all shrink-0 bg-kirby-white/60 text-kirby-pink-dark hover:bg-kirby-pink-light/40" href="/ks-kirby-website/dev-notes">📝 開發筆記</a><a class="px-4 py-2 rounded-full text-sm md:text-base font-medium transition-all shrink-0 bg-kirby-white/60 text-kirby-pink-dark hover:bg-kirby-pink-light/40" href="/ks-kirby-website/english">📖 英文學習</a><a class="px-4 py-2 rounded-full text-sm md:text-base font-medium transition-all shrink-0 bg-kirby-pink-main text-white shadow-md" href="/ks-kirby-website/review">🃏 英文複習卡</a></nav>
<main class="max-w-4xl mx-auto px-4 py-8 sm:px-6 sm:py-12 w-full overflow-x-hidden">
<style>
.flip-card {
  perspective: 1200px;
  width: 100%;
  max-width: 360px;
  height: 280px;
}
.flip-card-back {
  justify-content: space-between;
}
.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}
.flip-card.revealed .flip-card-inner {
  transform: rotateY(180deg);
}
.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  box-shadow: 0 4px 20px rgba(224, 108, 132, 0.15);
}
.flip-card-front {
  background: linear-gradient(135deg, #FFF0F3, #FFE4EC);
  border: 2px solid #FFB7C5;
}
.flip-card-back {
  background: linear-gradient(135deg, #f0faf4, #e0f5e8);
  border: 2px solid #2d8a56;
  transform: rotateY(180deg);
}
.card-tag {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 0.2rem 0.6rem;
  border-radius: 9999px;
}
.card-date-tag {
  position: absolute;
  bottom: 0.75rem;
  right: 0.75rem;
  font-size: 0.6rem;
  color: #E06C84;
  opacity: 0.5;
}
.flip-hint {
  font-size: 0.9rem;
  color: #E06C84;
  opacity: 0.6;
  letter-spacing: 0.05em;
}
.flip-card-back .card-tag {
  background: #2d8a56;
  color: #fff;
}
@keyframes pulseHint {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.05); opacity: 0.9; }
}
.pulse {
  animation: pulseHint 2s ease-in-out infinite;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
.slide-in {
  animation: slideIn 0.35s ease-out;
}
</style>

<header class="text-center mb-6 fade-in fade-1">
  <h1 class="text-4xl md:text-5xl font-bold text-kirby-pink-main mb-2">🃏 英文複習卡</h1>
  <p class="text-kirby-pink-dark/60 text-lg">點擊右邊卡片，檢查你的文法記憶！</p>
</header>

<!-- Controls -->
<div class="flex items-center justify-center gap-4 mb-8">
  <button id="shuffle-btn" class="bg-kirby-pink-main text-white px-6 py-2 rounded-full text-sm font-bold shadow-md hover:shadow-lg hover:bg-kirby-pink-dark transition-all flex items-center gap-2">
    🎲 下一題
  </button>
  <span id="counter" class="text-sm text-kirby-pink-dark/50 font-medium min-w-[80px] text-center"></span>
</div>

<!-- Cards -->
<div class="flex flex-col md:flex-row items-center justify-center gap-6 mb-8">
  <!-- Wrong Card (always visible) -->
  <div class="flip-card" id="wrong-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <span class="card-tag bg-kirby-pink-dark text-white">✏️ 請修正</span>
        <p class="text-xs text-kirby-pink-dark/50 mb-1">需要被糾正的句子</p>
        <p id="wrong-text" class="text-lg md:text-xl font-bold text-kirby-pink-dark text-center leading-relaxed"></p>
        <span class="card-date-tag" id="wrong-date"></span>
      </div>
      <div class="flip-card-back">
        <span class="card-tag">❌ 錯誤</span>
        <p class="text-lg md:text-xl font-bold text-kirby-pink-dark text-center leading-relaxed"></p>
      </div>
    </div>
  </div>

  <!-- Correct Card (flip to reveal) -->
  <div class="flip-card cursor-pointer" id="correct-card" onclick="this.classList.toggle('revealed')">
    <div class="flip-card-inner">
      <div class="flip-card-front" style="background: linear-gradient(135deg, #ffe8ed, #ffd4de);">
        <span class="card-tag bg-kirby-pink-light text-kirby-pink-dark">✅ 修正</span>
        <div class="flex flex-col items-center gap-3">
          <span class="flip-hint pulse">✋ Click to reveal</span>
        </div>
      </div>
      <div class="flip-card-back">
        <span class="card-tag">✅ 修正</span>
        <div class="flex-1 flex flex-col items-center justify-center">
          <p id="correct-text" class="text-lg md:text-xl font-bold text-green-700 text-center leading-relaxed"></p>
          <div class="mt-4 bg-green-50/80 rounded-xl px-4 py-3 border border-green-200 max-w-[280px]">
            <p class="text-xs text-green-700/70 leading-relaxed" id="rule-text"></p>
          </div>
        </div>
        <span class="card-date-tag" style="color:#2d8a56;" id="correct-date"></span>
      </div>
    </div>
  </div>
</div>

<!-- Stats -->
<div class="mt-10 text-center text-xs text-kirby-pink-dark/30">
  共 <span id="total-count">-</span> 張卡片 · 隨機出題
</div>

<script>
(function(){
  var supabase = window.supabase.createClient("https://ccxvgozrxtqatjwebjsa.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjeHZnb3pyeHRxYXRqd2VianNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNTUzNDUsImV4cCI6MjA5NDgzMTM0NX0.RS3Jsa9FgeIYq70dX24InJIqVlHWh6rWlZ0a-xfW-W0");
  var cards = [];
  var total = 0;
  var currentId = null;

  // Map Supabase field names to what the UI expects
  function mapCard(c){
    return {
      id: c.card_id,
      wrong: c.original,
      correct: c.corrected,
      rule: c.analysis,
      date: c.created_at ? c.created_at.substring(0, 10) : ''
    };
  }

  function pickRandom(){
    var idx = Math.floor(Math.random() * cards.length);
    return cards[idx];
  }

  function ensureDifferent(){
    if(cards.length <= 1) return pickRandom();
    var card = pickRandom();
    while(card.id === currentId){
      card = pickRandom();
    }
    return card;
  }

  function renderCard(card){
    currentId = card.id;
    document.getElementById('wrong-text').textContent = card.wrong;
    document.getElementById('correct-text').textContent = card.correct;
    document.getElementById('wrong-date').textContent = card.date;
    document.getElementById('correct-date').textContent = card.date;
    document.getElementById('rule-text').textContent = '💡 ' + card.rule;

    var idx = cards.findIndex(function(c){ return c.id === card.id; });
    document.getElementById('counter').textContent = '#' + (idx + 1) + ' / ' + total;

    // Animate
    document.getElementById('wrong-card').classList.add('slide-in');
    document.getElementById('correct-card').classList.add('slide-in');
    setTimeout(function(){
      document.getElementById('wrong-card').classList.remove('slide-in');
      document.getElementById('correct-card').classList.remove('slide-in');
    }, 350);

    // Reset flip
    document.getElementById('correct-card').classList.remove('revealed');
  }

  // Fetch cards from Supabase
  supabase.from('cards').select('*').order('created_at', { ascending: true }).then(function(res){
    if(res.error){ console.error(res.error); return; }
    cards = res.data.map(mapCard);
    total = cards.length;
    document.getElementById('total-count').textContent = total;
    if(cards.length > 0) renderCard(pickRandom());
  });

  document.getElementById('shuffle-btn').addEventListener('click', function(){
    if(cards.length === 0) return;
    renderCard(ensureDifferent());
  });
})();
</script></main>
</body></html>
